# Proxy inverso: es lo único expuesto a internet. La app (Flask/Gunicorn) queda detrás.
limit_req_zone $binary_remote_addr zone=chat:10m rate=20r/m;   # máx. 20 consultas por minuto por IP

server {
    listen 80;
    server_name _;
    client_max_body_size 1m;
    server_tokens off;

    # Con dominio propio: obtener certificado con certbot (Let's Encrypt), activar
    # "listen 443 ssl", las líneas ssl_certificate y redirigir el puerto 80 a HTTPS.
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location /api/chat {
        limit_req zone=chat burst=5 nodelay;
        proxy_pass http://app:5000;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:5000;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
